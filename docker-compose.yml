services:
  postgres:
    image: postgres:16-alpine
    container_name: decision-intelligence-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: decision_intelligence
      POSTGRES_USER: enterprise
      POSTGRES_PASSWORD: enterprise
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterprise -d decision_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: decision-intelligence-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: decision-intelligence-api
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      APP_DATABASE_URL: postgresql+psycopg://enterprise:enterprise@postgres:5432/decision_intelligence
      APP_CELERY_BROKER_URL: redis://redis:6379/0
      APP_CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  celery_worker:
    build:
      context: ./backend
    container_name: decision-intelligence-worker
    command: celery -A app.core.celery worker --loglevel=info
    restart: unless-stopped
    environment:
      APP_DATABASE_URL: postgresql+psycopg://enterprise:enterprise@postgres:5432/decision_intelligence
      APP_CELERY_BROKER_URL: redis://redis:6379/0
      APP_CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: decision-intelligence-ui
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
