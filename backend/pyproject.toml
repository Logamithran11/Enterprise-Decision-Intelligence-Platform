[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-decision-intelligence-platform"
version = "0.1.0"
description = "Enterprise Decision Intelligence & Business Insight Generation Platform"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.3",
  "numpy>=1.26",
  "pandas>=2.2",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7.4",
  "psycopg[binary]>=3.2",
  "celery>=5.4",
  "orjson>=3.10",
  "python-multipart>=0.0.9",
  "email-validator>=2.0",
]

[project.optional-dependencies]
ml = [
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "shap>=0.46",
  "joblib>=1.4",
  "optuna>=4.0",
  "Faker>=25.0",
  "matplotlib>=3.8",
  "seaborn>=0.13",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
